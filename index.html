<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Links and Word of the Day – daily word games about the circular economy. Find four groups of four words, or guess the word in 6 tries." />
    <meta name="theme-color" content="#fcfcf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)" />
    <title>Links – circular economy word games</title>
    <script>
      // Apply the saved theme before first paint (no light→dark flash).
      try {
        var t = JSON.parse(localStorage.getItem('circular:v1:theme') || 'null');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
